<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 안경을 찾아라!</title><style>
*{box-sizing:border-box}body{margin:0;background:#111b2b;color:#edf5ff;font-family:system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px 14px}h1{margin:8px 0;font-size:clamp(25px,5vw,42px)}p{color:#aebfd4;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}.stat{background:#233349;border-radius:12px;padding:12px;text-align:center;font-size:12px;color:#b9c9dc}.stat b{display:block;font-size:24px;color:white}.board{background:#244c43;border:6px solid #9b7850;border-radius:8px;text-align:center;padding:12px;color:#dcebe0}.classroom{background:#e1d4b9;padding:14px;border-radius:16px;margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.student{position:relative;border:0;background:#f5e8ce;border-radius:12px;cursor:pointer;padding:8px 0 0;overflow:hidden;touch-action:manipulation;min-width:0}.student svg{width:100%;max-width:115px;display:block;margin:auto}.student:active{transform:scale(.96)}.student:focus-visible{outline:3px solid #1a9bff}.desk{background:#ae7950;color:#fff;font-size:12px;padding:6px}.ai .lens{fill:#63eaff;stroke:#067aa9;filter:drop-shadow(0 0 5px #00d9ff)}.ai .hud{opacity:1}.hud{opacity:0}.caught{background:#b6edc8}.wrong{background:#ffb5b5}.bar{height:7px;background:#34445b;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#58dfbd;width:100%;transition:width .1s linear}button.action{border:0;border-radius:12px;background:#58dfbd;color:#102c28;font-weight:800;font-size:17px;padding:14px 25px;cursor:pointer}.controls{text-align:center;margin:18px 0}.feedback{height:30px;text-align:center;font-weight:bold;color:#58dfbd}.result{background:#233349;padding:20px;border-radius:16px;text-align:center;margin-top:15px}.result[hidden]{display:none}@media(max-width:480px){.classroom{gap:6px;padding:8px}.stat{padding:8px 2px}.stat b{font-size:20px}main{padding:14px 8px}}
</style></head><body><main><small>REACTION GAME · 시험 감독 시뮬레이션</small><h1>AI 안경을 찾아라!</h1><p>파란빛이 나는 AI 안경을 발견하면 즉시 클릭하세요. 일반 안경은 함정입니다!</p><div class="stats"><div class="stat">남은 시간<b id="time">30.0</b></div><div class="stat">점수<b id="score">0</b></div><div class="stat">콤보<b id="combo">0</b></div><div class="stat">최고 기록<b id="best">0</b></div></div><div class="bar"><i id="bar"></i></div><div class="controls"><button class="action" id="start">시험 시작</button> <label><input type="checkbox" id="sound" checked> 효과음</label></div><div class="board" id="board">시험 준비 중 · AI 안경 사용 금지</div><div class="classroom" id="room"></div><div class="feedback" id="feedback" aria-live="polite"></div><section class="result" id="result" hidden></section><p style="font-size:12px">※ 게임 속 파란빛은 가상의 판별 단서입니다. 실제 안경 착용만으로 부정행위를 판단할 수 없습니다.</p></main><script>
const $=id=>document.getElementById(id), room=$('room');let running=false,score=0,combo=0,hits=0,miss=0,wrong=0,end=0,next=0,active=new Map(),raf=0,audio,best=0;try{best=Number(localStorage.getItem('aiGlassesBest'))||0}catch(e){}$('best').textContent=best;
const skins=['#f4c49c','#e8b48c','#c78f69','#f8d4b0'],shirts=['#597fae','#a85e72','#629888','#8676ae'];
for(let i=0;i<12;i++){let b=document.createElement('button');b.className='student';b.setAttribute('aria-label',`${i+1}번 학생`);b.innerHTML=`<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M17 100 Q17 72 50 70 Q83 72 83 100" fill="${shirts[i%4]}"/><rect x="43" y="62" width="14" height="16" rx="5" fill="${skins[i%4]}"/><ellipse cx="50" cy="43" rx="28" ry="31" fill="${skins[i%4]}"/><path d="M22 40 Q12 4 50 5 Q86 5 78 40 L65 24 Q45 38 22 40" fill="${i%3===0?'#654532':'#302b32'}"/><circle cx="38" cy="45" r="3" fill="#292936"/><circle cx="62" cy="45" r="3" fill="#292936"/><g class="glasses" style="opacity:${i%3===0?1:0}"><rect class="lens" x="25" y="37" width="22" height="16" rx="5" fill="none" stroke="#303c48" stroke-width="2.5"/><rect class="lens" x="53" y="37" width="22" height="16" rx="5" fill="none" stroke="#303c48" stroke-width="2.5"/><path d="M47 43 H53" stroke="#303c48" stroke-width="3"/><g class="hud" stroke="#00557b" stroke-width="1.5"><path d="M29 41 h12 M29 45 h8 M57 41 h12 M57 45 h8"/></g></g><path d="M44 59 Q50 62 56 59" fill="none" stroke="#995c55" stroke-width="2"/><path d="M24 87 L48 80 L77 87 L75 99 H25Z" fill="#fffdf2"/><path d="M50 83 V98 M30 90 h14 M56 90 h14" stroke="#b3bdc7"/></svg><div class="desk">${i+1}번 학생</div>`;b.onclick=()=>pick(i);room.append(b)}
const students=[...room.children];function beep(ok){if(!$('sound').checked||!audio)return;try{let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=ok?880:180;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.15);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.16)}catch(e){}}
function clearAI(i){active.delete(i);students[i].classList.remove('ai');students[i].querySelector('.glasses').style.opacity=i%3===0?1:0}function update(){ $('score').textContent=score;$('combo').textContent=combo}function flash(i,c){let b=students[i];b.classList.remove('caught','wrong');b.classList.add(c);setTimeout(()=>b.classList.remove(c),250)}function pick(i){if(!running)return;if(performance.now()>=end){finish();return}if(active.has(i)&&active.get(i)>performance.now()){clearAI(i);hits++;combo++;let points=100+Math.min(combo-1,10)*10;score+=points;flash(i,'caught');$('feedback').textContent=`적발 성공! +${points}점`;beep(true)}else{if(active.has(i)){clearAI(i);miss++}wrong++;combo=0;score-=50;flash(i,'wrong');$('feedback').textContent='오인 적발! -50점';beep(false)}update()}
function loop(t){if(!running)return;let left=Math.max(0,end-t);$('time').textContent=(left/1000).toFixed(1);$('bar').style.width=left/300+'%';if(left<=0){finish();return}for(let [i,until] of active){if(t>=until){clearAI(i);miss++;combo=0;$('feedback').textContent='컨닝 학생을 놓쳤어요!';update()}}if(t>=next){let pool=students.map((_,i)=>i).filter(i=>!active.has(i));if(pool.length){let i=pool[Math.floor(Math.random()*pool.length)];active.set(i,t+650+left/30);students[i].classList.add('ai');students[i].querySelector('.glasses').style.opacity=1}next=t+450+left/40} $('board').textContent=left>20000?'시험 진행 중 · LEVEL 1':left>10000?'주의 집중 · LEVEL 2':'마지막 10초 · LEVEL 3';raf=requestAnimationFrame(loop)}
function finish(){running=false;cancelAnimationFrame(raf);for(let i of active.keys()){miss++;clearAI(i)}best=Math.max(best,score);try{localStorage.setItem('aiGlassesBest',best)}catch(e){}$('best').textContent=best;$('time').textContent='0.0';$('bar').style.width='0%';$('board').textContent='시험 종료!';$('start').disabled=false;$('start').textContent='다시 도전';$('result').hidden=false;$('result').innerHTML=`<h2>감독 결과 · ${score}점</h2><p>적발 성공 ${hits}명 · 놓친 학생 ${miss}명 · 오인 적발 ${wrong}회</p><p>적발률 ${hits+miss?Math.round(hits/(hits+miss)*100):0}%</p><strong>${hits>=20&&wrong<=2?'최고의 시험 감독관!':'다시 도전해 기록을 높여보세요!'}</strong>`}
$('start').onclick=()=>{if(running)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}score=combo=hits=miss=wrong=0;update();$('result').hidden=true;$('feedback').textContent='시험 시작!';$('start').disabled=true;running=true;end=performance.now()+30000;next=performance.now()+500;raf=requestAnimationFrame(loop)};
</script></body></html>
